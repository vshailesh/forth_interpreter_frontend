name: Phoenix CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    name: Forth Interpreter Frontend
    strategy:
      matrix:
        otp: ['29.0']
        elixir: ['1.20.4']
    steps:
    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        elixir-version: ${{matrix.elixir}}
    - name: Chekout code
      uses: actions/checkout@v3
    - name: Install dependencies and compile
      run: make build